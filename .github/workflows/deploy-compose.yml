name: Deploy Compose (site + banco)

on:
  push:
    branches: [main]
    paths:
      - 'site-db/**'
      - '.github/workflows/deploy-compose.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem web
        uses: docker/build-push-action@v6
        with:
          context: ./site-db/web
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/site-db-web:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Estágio de aprovação: o job só roda depois que um revisor aprovar
    # o environment "producao" (Settings > Environments).
    environment: producao

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Copiar docker-compose.yml para a VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: site-db/docker-compose.yml
          target: /home/azureuser/site-db
          strip_components: 1

      - name: Subir os containers com Docker Compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -e
            cd ~/site-db

            # Instala o plugin do Compose se ainda não existir
            if ! docker compose version >/dev/null 2>&1; then
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker-compose-v2
            fi

            # Variáveis usadas pelo docker-compose.yml
            printf 'POSTGRES_PASSWORD=%s\nDOCKERHUB_USERNAME=%s\nWEB_PORT=8081\n' '${{ secrets.POSTGRES_PASSWORD }}' '${{ secrets.DOCKERHUB_USERNAME }}' > .env
            chmod 600 .env

            docker compose pull
            docker compose up -d
            docker compose ps

      - name: Testar se o site e o banco responderam
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ secrets.AZURE_VM_HOST }}:8081/health"; then
              echo
              echo "Site e banco no ar"
              exit 0
            fi
            echo "Aguardando... ($i/12)"
            sleep 5
          done
          echo "O site não respondeu a tempo"
          exit 1

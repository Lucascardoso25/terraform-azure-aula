services:
  web:
    build: ./web                      # usado só no teste local
    image: ${DOCKERHUB_USERNAME}/site-db-web:latest
    container_name: site-db-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: app
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: recados
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: site-db-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: recados
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d recados"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural de recados - Docker Compose</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f3f4f6; color: #1f2937; margin: 0; padding: 24px; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { margin-bottom: 4px; }
    .sub { color: #6b7280; margin-top: 0; }
    .status { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 14px; background: #e5e7eb; }
    .status.ok { background: #d1fae5; color: #065f46; }
    .status.erro { background: #fee2e2; color: #991b1b; }
    form { background: #fff; padding: 16px; border-radius: 8px; margin: 16px 0; display: grid; gap: 10px; }
    input, textarea { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; }
    button { padding: 10px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #erro { color: #991b1b; margin: 0; }
    ul { list-style: none; padding: 0; display: grid; gap: 10px; }
    li { background: #fff; padding: 12px 16px; border-radius: 8px; }
    li strong { display: block; }
    li small { color: #6b7280; }
    li p { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Mural de recados</h1>
    <p class="sub">Site + banco de dados (PostgreSQL) com Docker Compose, implantado via GitHub Actions na Azure.</p>
    <p id="status" class="status">Verificando o banco...</p>

    <form id="form">
      <input id="nome" placeholder="Seu nome" maxlength="60" required>
      <textarea id="mensagem" placeholder="Deixe um recado" maxlength="280" rows="3" required></textarea>
      <button id="enviar" type="submit">Enviar recado</button>
      <p id="erro"></p>
    </form>

    <ul id="lista"></ul>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const lista = document.getElementById('lista');
    const form = document.getElementById('form');
    const erroEl = document.getElementById('erro');
    const botao = document.getElementById('enviar');

    async function checarBanco() {
      try {
        const resposta = await fetch('/health');
        statusEl.textContent = resposta.ok ? 'Banco de dados conectado' : 'Banco de dados indisponível';
        statusEl.className = 'status ' + (resposta.ok ? 'ok' : 'erro');
      } catch (e) {
        statusEl.textContent = 'Servidor indisponível';
        statusEl.className = 'status erro';
      }
    }

    async function carregar() {
      try {
        const resposta = await fetch('/api/recados');
        const recados = await resposta.json();
        lista.replaceChildren();
        recados.forEach((r) => {
          const li = document.createElement('li');
          const nome = document.createElement('strong');
          nome.textContent = r.nome;
          const data = document.createElement('small');
          data.textContent = new Date(r.criado_em).toLocaleString('pt-BR');
          const texto = document.createElement('p');
          texto.textContent = r.mensagem;
          li.append(nome, data, texto);
          lista.appendChild(li);
        });
      } catch (e) {
        erroEl.textContent = 'Não foi possível carregar os recados';
      }
    }

    form.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      erroEl.textContent = '';
      botao.disabled = true;
      try {
        const resposta = await fetch('/api/recados', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nome: document.getElementById('nome').value,
            mensagem: document.getElementById('mensagem').value,
          }),
        });
        if (!resposta.ok) {
          const dados = await resposta.json();
          erroEl.textContent = dados.erro || 'Erro ao enviar';
        } else {
          form.reset();
          await carregar();
        }
      } catch (e) {
        erroEl.textContent = 'Erro de conexão';
      } finally {
        botao.disabled = false;
      }
    });

    checarBanco();
    carregar();
  </script>
</body>
</html>
